<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · OpenSource Toolkit</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #e5e7eb;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 1rem;
        background: #1d4ed8;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #9ca3af;
        margin: 0 0 1.5rem;
        line-height: 1.6;
      }
      button {
        background: #1d4ed8;
        color: #fff;
        border: 0;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:hover {
        background: #1e40af;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 15h4" />
          <path
            d="m14.817 10.995-.971-1.45 1.034-1.232a2 2 0 0 0-2.025-3.238l-1.82.364L9.91 3.885a2 2 0 0 0-3.625.748L6.141 6.55l-1.725.426a2 2 0 0 0-.19 3.756l.657.27"
          />
          <path
            d="m18.822 10.995 2.26-5.38a1 1 0 0 0-.557-1.318L16.954 2.9a1 1 0 0 0-1.281.533l-.924 2.122"
          />
          <path
            d="M4 12.006A1 1 0 0 1 4.994 11H19a1 1 0 0 1 1 1v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"
          />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        OpenSource Toolkit needs a connection to load this page.<br />
        Check your network and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
